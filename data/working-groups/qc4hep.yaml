id: qc4hep
title: "Quantum Computing for High Energy Physics Working Group"
acronym: QC4HEP
shortDescription: >
  This technical working group brings together experts to identify and explore 
  high-impact problems in high energy physics suited to near-term quantum methods.
longDescription: >
  The Quantum Computing for High Energy Physics (QC4HEP) Working Group focuses on identifying realistic, 
  physically relevant problems in High Energy Physics (HEP) that are meaningful to the scientific community, 
  and which can be addressed using near-term quantum hardware. 
  The group explores problem classes and families of quantum algorithms that show potential to outperform classical methods.
