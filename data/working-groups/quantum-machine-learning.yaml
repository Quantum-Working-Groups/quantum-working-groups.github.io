id: quantum-machine-learning
order: 7
title: "Quantum Machine Learning Working Group"
acronym: QMLWG
shortDescription: >
  Identifying the key questions in quantum machine learning and where quantum computing 
  may offer new capabilities for learning, modeling, and discovery.
longDescription: >
  The Quantum Machine Learning working group brings together researchers to identify the scientific
  foundations and open questions that can guide the next phase of research at the intersection of quantum
  computing and machine learning. The group investigates foundational questions at the interface of quantum computing 
  and machine learning, with a focus on learning from quantum data, identifying quantum representations and sampling 
  primitives that may provide useful computational advantages, and using machine learning to improve and discover 
  quantum algorithms. A central goal is to connect these questions to applications by 
  formulating well-defined tasks, meaningful baselines, and rigorous evaluation criteria.
