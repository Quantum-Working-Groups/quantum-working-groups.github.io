id: optimization
title: "Quantum Optimization"
acronym: QOWG
shortDescription: > 
  Driving quantum optimization from theory to practice, this collaboration combines advanced 
  algorithms and systematic benchmarking towards demonstrating quantum advantage for real-world use cases.
longDescription: >
  Founded in Zurich in 2023, the Quantum Optimization Working Group is an international collaboration that
  brings together academic and industry experts to advance the field of quantum optimization. Since its
  inception, the group has produced foundational insights, benchmarking frameworks, and novel algorithms.
  Through rigorous research and collaborative exchange, the initiative works to clarify the practical
  potential of quantum optimization, define best practices, and accelerate development of solutions to
  real-world problems.
