id: sustainability
title: "Sustainability Quantum Working Group"
acronym: SQWG
shortDescription: "Researchers and domain experts explore quantum-centric solutions to sustainable development across energy, forestry, climate, semiconductors, carbon capture, and beyond."
longDescription: >
  The Sustainability Quantum Working Group, established in 2024, brings together researchers in quantum
  computing and domain experts across industries to explore how quantum computing may soon help address
  complex, high-impact problems in sustainability that lie beyond the reach of classical computing methods.
  The group investigates problem classes in fields like energy, climate, forestry, semiconductors, and
  carbon capture to identify use cases where quantum methods may provide meaningful solutions. Through
  collaborative research and analysis, the working group seeks to clarify the practical potential of
  quantum computing for sustainable development.
