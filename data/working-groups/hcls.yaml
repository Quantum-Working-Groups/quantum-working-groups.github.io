id: hcls
order: 1
title: "Health Care & Life Sciences Quantum Working Group"
acronym: HCLS
shortDescription: >
  Unites experts to advance research in health care and life sciences with the aid of quantum computation 
  across biomarkers, omics, clinical trials, and beyond.
longDescription: >
  Launched in 2023, the Health Care & Life Sciences (HCLS) Quantum Technical Working Group is a global
  initiative that brings together expertise across health care, life sciences, and computational fields to
  identify, define, and advance quantum-enabled approaches to challenges in biomarkers, omics, neuroscience,
  and more. In 2025, the group expanded to include its first geographic hub in Asia-Pacific, strengthening
  its ability to connect expertise and resources across time zones and continents.
